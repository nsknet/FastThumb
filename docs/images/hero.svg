<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 440" width="1420" height="440" role="img" aria-labelledby="t">
  <title id="t">FastThumb — any file to a thumbnail, in-process</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset=".55" stop-color="#140f33"/>
      <stop offset="1" stop-color="#22104a"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#22d3ee" stop-opacity=".12"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="speed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity=".7"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <style>
      .title{font:800 76px "Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;letter-spacing:-.02em}
      .sub{font:400 23px "Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;fill:#cbd5e1}
      .chip{font:600 14px ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;fill:#e2e8f0}
      .lab{font:700 12px ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}
    </style>
  </defs>

  <rect width="1420" height="440" rx="20" fill="url(#bg)"/>
  <rect width="1420" height="440" rx="20" fill="url(#grid)"/>

  <!-- text block -->
  <g transform="translate(68,52)">
    <rect width="290" height="30" rx="15" fill="#10b981" fill-opacity=".14" stroke="#10b981" stroke-opacity=".6"/>
    <circle cx="18" cy="15" r="4" fill="#34d399"/>
    <text x="32" y="20" font-family="Segoe UI,-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing=".12em" fill="#6ee7b7">FREE · OPEN SOURCE · MIT</text>
  </g>
  <text class="title" x="64" y="150" fill="#f8fafc">Fast<tspan fill="url(#core)">Thumb</tspan></text>
  <text class="sub" x="68" y="198">Any document, image or video → thumbnails + preview PDF.</text>
  <text class="sub" x="68" y="232">One call. In-process. No Office, no LibreOffice, no browser.</text>

  <g transform="translate(68,272)">
    <rect width="112" height="34" rx="17" fill="#8b5cf6" fill-opacity=".16" stroke="#8b5cf6" stroke-opacity=".5"/>
    <text class="chip" x="56" y="22" text-anchor="middle">.NET 8/10</text>
    <rect x="124" width="128" height="34" rx="17" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/>
    <text class="chip" x="188" y="22" text-anchor="middle">40+ formats</text>
    <rect x="264" width="138" height="34" rx="17" fill="#10b981" fill-opacity=".12" stroke="#10b981" stroke-opacity=".5"/>
    <text class="chip" x="333" y="22" text-anchor="middle">0 processes</text>
    <rect x="414" width="150" height="34" rx="17" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-opacity=".5"/>
    <text class="chip" x="489" y="22" text-anchor="middle">Win·Linux·macOS</text>
  </g>
  <text x="68" y="360" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="17" fill="#94a3b8"><tspan fill="#a78bfa">var</tspan> result = <tspan fill="#67e8f9">ThumbnailGenerator</tspan>.Default.<tspan fill="#fde68a">GenerateFromFile</tspan>(<tspan fill="#86efac">"deck.pptx"</tspan>);</text>

  <!-- illustration -->
  <g transform="translate(760,0)">
    <!-- speed lines -->
    <g stroke="url(#speed)" stroke-width="2" stroke-linecap="round">
      <line x1="40" y1="120" x2="250" y2="120"/>
      <line x1="10" y1="170" x2="245" y2="170"/>
      <line x1="60" y1="270" x2="245" y2="270"/>
      <line x1="20" y1="320" x2="250" y2="320"/>
    </g>

    <!-- input file cards (tilted) -->
    <g transform="translate(70,90) rotate(-8)">
      <rect width="74" height="94" rx="9" fill="#1e1b4b" stroke="#8b5cf6"/>
      <g fill="#a78bfa" fill-opacity=".55"><rect x="12" y="18" width="50" height="5" rx="2"/><rect x="12" y="30" width="42" height="5" rx="2"/><rect x="12" y="42" width="48" height="5" rx="2"/><rect x="12" y="54" width="30" height="5" rx="2"/></g>
      <text class="lab" x="12" y="82" fill="#c4b5fd">DOCX</text>
    </g>
    <g transform="translate(150,140) rotate(6)">
      <rect width="74" height="94" rx="9" fill="#052e2b" stroke="#10b981"/>
      <g stroke="#34d399" stroke-opacity=".6"><path d="M10 20H64M10 34H64M10 48H64M10 62H64M28 14V66M46 14V66" fill="none"/></g>
      <text class="lab" x="12" y="84" fill="#6ee7b7">XLSX</text>
    </g>
    <g transform="translate(40,230) rotate(4)">
      <rect width="94" height="70" rx="9" fill="#2a1306" stroke="#f59e0b"/>
      <rect x="12" y="12" width="70" height="30" rx="4" fill="#f59e0b" fill-opacity=".3"/>
      <text class="lab" x="12" y="60" fill="#fcd34d">PPTX</text>
    </g>
    <g transform="translate(140,262) rotate(-7)">
      <rect width="90" height="66" rx="9" fill="#2a0b14" stroke="#f43f5e"/>
      <path d="M38 18 L58 32 L38 46 Z" fill="#fb7185"/>
      <text class="lab" x="10" y="60" fill="#fda4af">MP4</text>
    </g>
    <g transform="translate(150,40) rotate(10)">
      <rect width="62" height="80" rx="8" fill="#0c1a33" stroke="#3b82f6"/>
      <text class="lab" x="12" y="68" fill="#93c5fd">PDF</text>
      <g fill="#60a5fa" fill-opacity=".5"><rect x="10" y="14" width="42" height="5" rx="2"/><rect x="10" y="26" width="34" height="5" rx="2"/><rect x="10" y="38" width="40" height="5" rx="2"/></g>
    </g>

    <!-- core -->
    <circle cx="330" cy="220" r="150" fill="url(#glow)"/>
    <circle cx="330" cy="220" r="66" fill="#0f172a" stroke="url(#core)" stroke-width="3"/>
    <path d="M342 168 L304 228 H330 L318 274 L358 210 H332 Z" fill="url(#core)"/>

    <!-- output thumbnails -->
    <g stroke="#22d3ee" stroke-opacity=".75" stroke-width="1.5">
      <line x1="400" y1="220" x2="440" y2="220"/>
    </g>
    <g transform="translate(450,98)">
      <rect width="110" height="142" rx="10" fill="#f8fafc"/>
      <rect x="12" y="14" width="86" height="40" rx="4" fill="#8b5cf6" fill-opacity=".85"/>
      <g fill="#94a3b8"><rect x="12" y="66" width="86" height="6" rx="3"/><rect x="12" y="80" width="70" height="6" rx="3"/><rect x="12" y="94" width="80" height="6" rx="3"/><rect x="12" y="108" width="54" height="6" rx="3"/></g>
      <text class="lab" x="55" y="160" text-anchor="middle" fill="#67e8f9">1000</text>
    </g>
    <g transform="translate(574,140)">
      <rect width="72" height="93" rx="8" fill="#f8fafc"/>
      <rect x="8" y="9" width="56" height="26" rx="3" fill="#8b5cf6" fill-opacity=".85"/>
      <g fill="#94a3b8"><rect x="8" y="43" width="56" height="4" rx="2"/><rect x="8" y="52" width="46" height="4" rx="2"/><rect x="8" y="61" width="52" height="4" rx="2"/></g>
      <text class="lab" x="36" y="111" text-anchor="middle" fill="#67e8f9">500</text>
    </g>
    <g transform="translate(578,262)">
      <rect width="46" height="60" rx="6" fill="#f8fafc"/>
      <rect x="6" y="6" width="34" height="17" rx="2" fill="#8b5cf6" fill-opacity=".85"/>
      <g fill="#94a3b8"><rect x="6" y="28" width="34" height="3" rx="1.5"/><rect x="6" y="35" width="28" height="3" rx="1.5"/></g>
      <text class="lab" x="23" y="78" text-anchor="middle" fill="#67e8f9">300</text>
    </g>
    <g transform="translate(470,272)">
      <rect width="80" height="56" rx="7" fill="#e2e8f0" stroke="#22d3ee" stroke-opacity=".5"/>
      <g fill="#a78bfa" fill-opacity=".5"><rect x="10" y="10" width="44" height="4" rx="2"/><rect x="10" y="20" width="58" height="4" rx="2"/><rect x="10" y="30" width="38" height="4" rx="2"/></g>
      <text class="lab" x="40" y="74" text-anchor="middle" fill="#c4b5fd">preview.pdf</text>
    </g>
  </g>
</svg>
